[project]
name = "omascribe"
version = "0.1.0"
description = "OmaScribe - AI-Powered Rich Text Editor with Real-Time Review, Whisper Dictation, and DOCX/PDF Export"
readme = "README.md"
requires-python = ">=3.11"
# PyQt6 is GPL-3.0-only, so the whole program is GPL-3.0-only: not "or later",
# and not a permissive licence. See the License section in README.md.
license = "GPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
    "PyQt6>=6.6.0",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    "httpx>=0.27.0",
    "diff-match-patch>=20230430",
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pyphen>=0.18.1",
    # Importeras direkt av core/epub.py (EPUB-paketet byggs med lxmls etree).
    # Den kom tidigare bara med som python-docx' eget beroende, vilket gör en
    # direkt import beroende av någon annans kravlista.
    "lxml>=5.0",
]

[project.scripts]
omascribe = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Gäller samtliga byggmål (wheel OCH sdist). En sdist ärver annars sitt
# filurval från .gitignore, vilket gör skyddet beroende av att ignore-reglerna
# råkade stämma. Här är exkluderingen explicit i stället.
[tool.hatch.build]
exclude = [
    "*.doc", "*.docx", "*.pdf", "*.odt", "*.rtf",
    "*.key", "*.pem", ".env", ".env.*", "secrets*",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]
