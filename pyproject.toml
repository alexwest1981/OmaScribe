[project]
name = "omascribe"
version = "0.1.0"
description = "OmaScribe - AI-Powered Rich Text Editor with Real-Time Review, Whisper Dictation, and DOCX/PDF Export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    "httpx>=0.27.0",
    "diff-match-patch>=20230430",
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1"
]

[project.scripts]
omascribe = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Gäller samtliga byggmål (wheel OCH sdist). En sdist ärver annars sitt
# filurval från .gitignore, vilket gör skyddet beroende av att ignore-reglerna
# råkade stämma. Här är exkluderingen explicit i stället.
[tool.hatch.build]
exclude = [
    "*.doc", "*.docx", "*.pdf", "*.odt", "*.rtf",
    "*.key", "*.pem", ".env", ".env.*", "secrets*",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]
